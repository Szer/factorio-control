name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- --openapi > openapi.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run api:generate && npm run format:check && npm run check && npm test && npm run build
        working-directory: web
      - run: git diff --exit-code -- openapi.json web/src/api.generated.ts
